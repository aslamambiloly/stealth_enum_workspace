name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Dart
        uses: dart-lang/setup-dart@v1
        with:
          sdk: stable

      - name: Analyze stealth_enum
        run: |
          cd packages/stealth_enum
          dart pub get
          dart analyze --fatal-infos

      - name: Analyze stealth_enum_generator
        run: |
          cd packages/stealth_enum_generator
          dart pub get
          dart analyze --fatal-infos

      - name: Test stealth_enum
        run: |
          cd packages/stealth_enum
          dart test

      - name: Test stealth_enum_generator
        run: |
          cd packages/stealth_enum_generator
          dart pub get
          dart test

      - name: Verify Secret Key Strength Guard
        shell: bash
        run: |
          # Verify documented CI regex guard in bash
          TEST_KEY="$(python3 -c 'import secrets;print(secrets.token_urlsafe(24))')"
          [[ "${TEST_KEY:-}" =~ ^[A-Za-z0-9_-]{32,}$ ]] || { echo "Valid secret key unexpectedly failed regex guard"; exit 1; }
          # Verify weak key fails guard
          WEAK_KEY="short_weak_key_123"
          if [[ "${WEAK_KEY:-}" =~ ^[A-Za-z0-9_-]{32,}$ ]]; then
            echo "Weak key unexpectedly passed regex guard"; exit 1;
          fi
          echo "Secret key CI regex guard verified."

      - name: Verify build_runner code generation
        run: |
          cd example
          dart pub get
          dart run build_runner build --delete-conflicting-outputs
          git diff --exit-code lib/

      - name: Run AOT String Removal Verification Benchmark
        run: bash scripts/verify_aot_strings.sh

      - name: Install coverage tool
        run: dart pub global activate coverage

      - name: Run tests with coverage
        run: |
          cd packages/stealth_enum
          dart pub get
          dart pub global run coverage:test_with_coverage
          cd ../stealth_enum_generator
          dart pub get
          dart pub global run coverage:test_with_coverage
          cd ../../example
          dart pub get
          dart pub global run coverage:test_with_coverage

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: |
            packages/stealth_enum/coverage/lcov.info
            packages/stealth_enum_generator/coverage/lcov.info
            example/coverage/lcov.info
          fail_ci_if_error: false

