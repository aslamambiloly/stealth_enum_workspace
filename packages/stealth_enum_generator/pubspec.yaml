name: stealth_enum_generator
description: >-
  Code generator for stealth_enum that transforms private enums into
  zero-cost obfuscated extension types to eliminate AOT binary metadata.
version: 1.0.4
repository: https://github.com/aslamambiloly/stealth_enum_workspace
issue_tracker: https://github.com/aslamambiloly/stealth_enum_workspace/issues

topics:
  - security
  - obfuscation
  - reverse-engineering
  - code-generation
  - build-runner

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  analyzer: ">=6.0.0 <15.0.0"
  build: ">=2.3.0 <6.0.0"
  source_gen: ">=1.4.0 <5.0.0"
  stealth_enum: ">=0.1.0 <2.0.0"

dev_dependencies:
  build_runner: ">=2.4.0 <3.0.0"
  lints: ^6.1.0
  test: "^1.24.0"
