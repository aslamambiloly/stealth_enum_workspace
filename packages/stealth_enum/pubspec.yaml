name: stealth_enum
description: >-
  Obfuscates Dart enums into zero-cost extension types backed by high-entropy
  integers, eliminating enum metadata from Flutter AOT binaries.
version: 2.2.1
repository: https://github.com/aslamambiloly/stealth_enum_workspace
issue_tracker: https://github.com/aslamambiloly/stealth_enum_workspace/issues

topics:
  - security
  - obfuscation
  - reverse-engineering
  - code-generation
  - anti-tamper

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  meta: ">=1.9.0 <2.0.0"

dev_dependencies:
  lints: "^4.0.0"
  test: "^1.24.0"
