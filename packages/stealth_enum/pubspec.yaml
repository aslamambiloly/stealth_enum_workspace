name: stealth_enum
description: >-
  Obfuscate Dart enums into zero-cost Dart 3 extension types backed by
  randomized 32-bit integers. Eliminates enum name metadata from Flutter AOT
  binaries, defeating AI-driven reverse-engineering pipelines (REA + Blutter).
version: 0.1.0
repository: https://github.com/aslamambiloly/stealth_enum_workspace
issue_tracker: https://github.com/aslamambiloly/stealth_enum_workspace/issues

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  meta: ">=1.9.0 <2.0.0"

dev_dependencies:
  lints: "^4.0.0"
  test: "^1.24.0"
